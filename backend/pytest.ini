[pytest]
# asyncio_mode = auto lets us write `async def test_*` without decorating each
# one with @pytest.mark.asyncio (pytest-asyncio runs them on an event loop).
asyncio_mode = auto
# Make the backend package root importable so tests can `from app.services ...`
# when pytest is invoked from the backend/ directory.
pythonpath = .
testpaths = tests